name: smartplate

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartplate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartplate_dev}
      POSTGRES_DB: smartplate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smartplate -d smartplate"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: apps/main-service/Dockerfile
    command:
      [
        "sh",
        "-c",
        "bunx drizzle-kit migrate && DATABASE_URL=$$APP_DATABASE_URL bun run db/seed/index.ts",
      ]
    restart: "no"
    environment:
      DATABASE_URL: postgres://smartplate:${POSTGRES_PASSWORD:-smartplate_dev}@postgres:5432/smartplate
      APP_DATABASE_URL: postgres://smartplate_app:${APP_DB_PASSWORD:-smartplate_app_dev}@postgres:5432/smartplate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  main-service:
    build:
      context: .
      dockerfile: apps/main-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://smartplate_app:${APP_DB_PASSWORD:-smartplate_app_dev}@postgres:5432/smartplate
      REDIS_URL: redis://redis:6379
      AGENT_SERVICE_URL: http://agent-service:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      ESCALATION_WINDOW_SECONDS: ${ESCALATION_WINDOW_SECONDS:-30}
      NGO_BUFFER_HOURS: ${NGO_BUFFER_HOURS:-4}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    volumes:
      - runtime_data:/app/.runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]

  worker:
    build:
      context: .
      dockerfile: apps/main-service/Dockerfile
    restart: unless-stopped
    command: ["bun", "run", "apps/main-service/src/worker.ts"]
    environment:
      DATABASE_URL: postgres://smartplate_app:${APP_DB_PASSWORD:-smartplate_app_dev}@postgres:5432/smartplate
      REDIS_URL: redis://redis:6379
      AGENT_SERVICE_URL: http://agent-service:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      ESCALATION_WINDOW_SECONDS: ${ESCALATION_WINDOW_SECONDS:-30}
      NGO_BUFFER_HOURS: ${NGO_BUFFER_HOURS:-4}
    volumes:
      - runtime_data:/app/.runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  agent-service:
    build:
      context: ./apps/agent-service
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - main-service
    networks: [edge]

  bot-service:
    build:
      context: .
      dockerfile: apps/bot-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      MAIN_URL: http://main-service:3000
      AGENT_URL: http://agent-service:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      BOT_POLLING: ${BOT_POLLING:-true}
      BOT_REQUEST_TIMEOUT_MS: ${BOT_REQUEST_TIMEOUT_MS:-25000}
      BOT_DEFAULT_TENANT_CODE: ${BOT_DEFAULT_TENANT_CODE:-spice-route}
      BOT_DEFAULT_TENANT_EMAIL: ${BOT_DEFAULT_TENANT_EMAIL:-asha@spiceroute.local}
      ORCHESTRATOR_ENABLED: ${ORCHESTRATOR_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      main-service:
        condition: service_started
    networks: [internal]

networks:
  edge:
  # Deliberately not `internal: true` — agent-service needs egress to Gemini.
  internal:

volumes:
  postgres_data:
  redis_data:
  runtime_data:
