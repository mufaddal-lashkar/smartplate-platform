[project]
name = "smartplate-agent-service"
version = "0.1.0"
description = "Stateless AI compute service. No database, no Redis, no outbound calls but Gemini."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
