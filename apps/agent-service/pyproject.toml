[project]
name = "smartplate-agent-service"
version = "0.1.0"
description = "Stateless AI compute service. No database, no Redis, no outbound calls but Gemini."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.30",
    "langchain-google-genai>=2.0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Windows bind mounts present every file as mode 777, so ruff sees an
# executable file with no shebang. Environmental, not a code property.
ignore = ["EXE002"]
